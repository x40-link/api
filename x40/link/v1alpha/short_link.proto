syntax = "proto3";

package x40.link.v1alpha;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "x40/link/v1alpha/auth.proto";

option go_package = "github.com/x40-link/api/gen/x40/link/v1alpha;v1alpha";
option java_multiple_files = true;
option java_outer_classname = "ShortLinkProto";
option java_package = "com.x40.link.v1alpha";

// Authenticated management of short links. The public HTTP redirect remains
// outside this service and continues to use status 307.
service ShortLinkService {
  // Atomically claim an explicit path or generate an unused suffix. Generated
  // collisions are retried; no existing link is overwritten.
  // Writes complete synchronously and return the resource directly.
  // (-- api-linter: core::0133::response-lro=disabled --)
  rpc CreateShortLink(CreateShortLinkRequest) returns (ShortLink) {
    option (google.api.http) = {
      post: "/v1alpha/{parent=domains/*}/shortLinks"
      body: "short_link"
    };
    option (google.api.method_signature) = "parent,short_link";
    option (x40.link.v1alpha.oauth2_scope) = "api.x40.link/scopes/x40.link.v1alpha.ShortLinkService.CreateShortLink";
  }

  // Read an owned link, including before DNS points to the short domain.
  rpc GetShortLink(GetShortLinkRequest) returns (ShortLink) {
    option (google.api.http) = {get: "/v1alpha/{name=domains/*/shortLinks/*}"};
    option (google.api.method_signature) = "name";
    option (x40.link.v1alpha.oauth2_scope) = "api.x40.link/scopes/x40.link.v1alpha.ShortLinkService.GetShortLink";
  }

  // List owned links in one domain or, with domains/-, across all domains.
  rpc ListShortLinks(ListShortLinksRequest) returns (ListShortLinksResponse) {
    option (google.api.http) = {get: "/v1alpha/{parent=domains/*}/shortLinks"};
    option (google.api.method_signature) = "parent";
    option (x40.link.v1alpha.oauth2_scope) = "api.x40.link/scopes/x40.link.v1alpha.ShortLinkService.ListShortLinks";
  }

  // Apply mutable fields. On success reads and redirects see the new state.
  // Writes complete synchronously and return the resource directly.
  // (-- api-linter: core::0134::response-lro=disabled --)
  rpc UpdateShortLink(UpdateShortLinkRequest) returns (ShortLink) {
    option (google.api.http) = {
      patch: "/v1alpha/{short_link.name=domains/*/shortLinks/*}"
      body: "short_link"
    };
    option (google.api.method_signature) = "short_link,update_mask";
    option (x40.link.v1alpha.oauth2_scope) = "api.x40.link/scopes/x40.link.v1alpha.ShortLinkService.UpdateShortLink";
  }

  // Delete an owned link. On success reads and redirects see its absence.
  // Writes complete synchronously and return Empty directly.
  // (-- api-linter: core::0135::response-lro=disabled --)
  rpc DeleteShortLink(DeleteShortLinkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha/{name=domains/*/shortLinks/*}"};
    option (google.api.method_signature) = "name";
    option (x40.link.v1alpha.oauth2_scope) = "api.x40.link/scopes/x40.link.v1alpha.ShortLinkService.DeleteShortLink";
  }
}

// A managed HTTP redirect at one source domain and path.
//
// The identity is (canonical domain, canonical path), regardless of whether a
// source request uses HTTP or HTTPS. Writes take effect synchronously; after a
// successful write, management reads and HTTP redirects observe the result.
// No delete_time or display_name is exposed: links are hard-deleted and path
// is their readable identity. (AIP-148 exception.)
// (-- api-linter: core::0148::declarative-friendly-fields=disabled --)
// The synchronous resource has no in-flight reconciliation state.
// (-- api-linter: core::0128::resource-reconciling-field=disabled --)
// encoded_path names the reversible path encoding rather than an arbitrary ID.
// (-- api-linter: core::0123::resource-pattern-singular=disabled --)
message ShortLink {
  option (google.api.resource) = {
    type: "api.x40.link/ShortLink"
    pattern: "domains/{domain}/shortLinks/{encoded_path}"
    singular: "shortLink"
    plural: "shortLinks"
    style: DECLARATIVE_FRIENDLY
  };

  // The resource name. Format: domains/{domain}/shortLinks/{encoded_path}.
  // The server derives encoded_path as "p" followed by unpadded RFC 4648
  // Base32 of the UTF-8 bytes of the canonical path, in lowercase. Decoding
  // after the prefix is reversible. For example, "/" becomes "pf4".
  // This path-derived name deliberately has no independent short_link_id
  // request field (an exception to AIP-133). On create, name is ignored.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The source path, starting with "/". Path identity follows URI rules:
  // case, literal "+", repeated slashes, and escaped reserved characters
  // remain distinct. Percent escapes use uppercase hex in canonical form;
  // escapes for unreserved characters are decoded. A source query is ignored
  // and is never appended to destination_url. On create, omission requests a
  // generated suffix; an explicit "/" claims the root path. On update, the
  // path is immutable and, if supplied, must match name.
  optional string path = 2 [(google.api.field_behavior) = IMMUTABLE];

  // An absolute HTTP or HTTPS destination URL. Required on create.
  string destination_url = 3 [(google.api.field_behavior) = REQUIRED];

  // User-managed metadata. A mask containing "annotations" replaces the map;
  // an empty map clears it.
  map<string, string> annotations = 4 [(google.api.field_behavior) = OPTIONAL];

  // The server-assigned identity of this incarnation. Deleting and recreating
  // the same name produces a new uid.
  // The pinned googleapis dependency lacks field_info.proto for UUID4 format.
  // (-- api-linter: core::0148::uid-format=disabled --)
  string uid = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this incarnation was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the mutable state last changed. An identical update leaves it alone.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The canonical HTTPS source URL, computed by the server.
  string short_url = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // An opaque, quoted, server-computed strong ETag. It changes when mutable
  // state changes and cannot match the ETag of a previous incarnation at the
  // same name. If supplied on update, it is a precondition, not a change.
  string etag = 9;
}

// Request to claim one source address, or generate an available suffix.
// The source path replaces an independent short_link_id by design.
// (-- api-linter: core::0133::request-id-field=disabled --)
message CreateShortLinkRequest {
  // The canonical domain parent. Format: domains/{domain}. Any syntactically
  // valid domain is accepted; explicit ports are invalid. Domains are
  // normalized to lowercase. Domain creation policy belongs to authorization.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "api.x40.link/ShortLink"
  ];

  // The link to create. path may be omitted to generate a suffix. name and
  // output-only fields are ignored. An explicit duplicate returns
  // ALREADY_EXISTS if visible to the caller, otherwise PERMISSION_DENIED.
  ShortLink short_link = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional idempotency key, at most 36 ASCII characters; UUIDs are accepted.
  // Successful results are retained for 24 hours, scoped to caller and request.
  // Reusing an ID for a different request is invalid. A lost-response retry
  // returns the original result, including for generated paths.
  // The pinned googleapis dependency lacks field_info.proto for UUID4 format.
  // (-- api-linter: core::0155::request-id-format=disabled --)
  string request_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // Check permissions, validity and conflicts without claiming an address or
  // recording request_id. The response is the proposed ShortLink.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request to read one owned link.
message GetShortLinkRequest {
  // Format: domains/{domain}/shortLinks/{encoded_path}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "api.x40.link/ShortLink"
  ];
}

// Request to list links owned by the caller.
message ListShortLinksRequest {
  // Format: domains/{domain}, or domains/- for all domains. Only links owned
  // by the caller are returned. The result is strongly consistent with writes.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "api.x40.link/ShortLink"
  ];

  // Maximum number to return. The service chooses a sensible default when
  // zero; it may cap larger values. Negative values are invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Token from a previous response; all other parameters must match.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Links owned by the caller in the requested domain scope.
message ListShortLinksResponse {
  // The links owned by the caller in the requested domain scope.
  repeated ShortLink short_links = 1;

  // Token for the next page; empty when this is the final page.
  string next_page_token = 2;
}

// Request to change a link's destination or annotations.
message UpdateShortLinkRequest {
  // The link to update. name is required. Only destination_url and
  // annotations are mutable. An optional etag is checked before the write.
  ShortLink short_link = 1 [(google.api.field_behavior) = REQUIRED];

  // Fields to change. Allowed paths are destination_url and annotations.
  // An omitted mask updates populated mutable fields. "*" replaces both
  // mutable fields; an explicitly masked empty value clears annotations.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Create the named link if absent, applying all supplied mutable state and
  // ignoring update_mask. Existing links can only be changed by their owner;
  // an identical desired state returns the existing resource unchanged.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];

  // Perform the normal checks without changing the link.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request to release one source address.
message DeleteShortLinkRequest {
  // Format: domains/{domain}/shortLinks/{encoded_path}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "api.x40.link/ShortLink"
  ];

  // If present, must match the current ETag; a mismatch returns ABORTED.
  // Ignored when the link is absent and allow_missing is true.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Succeed without a write if the link is absent. Existing links still
  // require owner permission. A deleted address is immediately reusable.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];

  // Perform the normal checks without deleting the link.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}
